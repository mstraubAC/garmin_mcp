# See https://pre-commit.com for more hooks.
# Install: pre-commit install && pre-commit install --hook-type pre-push

repos:
  # ------------------------------------------------------------------
  # Generic file hygiene
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^tests/integration/
      - id: sort-simple-yaml

  # ------------------------------------------------------------------
  # Python linting & formatting
  # ------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ------------------------------------------------------------------
  # Security scanners
  # ------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [--configfile=pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: uv.lock

  # ------------------------------------------------------------------
  # Type checking
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-python-dateutil
        args: [--strict, --ignore-missing-imports]
        files: ^src/

  # ------------------------------------------------------------------
  # Push-stage: full test suite with coverage
  # Runs on `git push`, not on every `git commit`.
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest-coverage
        name: pytest with coverage
        entry: uv run coverage run -m pytest tests/unit tests/integration -q && uv run coverage report --fail-under=78
        language: system
        pass_filenames: false
        always_run: true
        stages: [push]
