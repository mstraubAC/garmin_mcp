name: Security Checks

on:
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Export requirements for audit
      run: uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/audit-reqs.txt

    - name: Run pip-audit (fails on any CVE)
      run: |
        uvx pip-audit --requirement /tmp/audit-reqs.txt --strict
        echo "No known vulnerabilities found."

    - name: Verify lock file is up to date
      run: |
        uv lock --check
        if [ $? -ne 0 ]; then
          echo "⚠️ Lock file is out of sync with pyproject.toml"
          echo "Run 'uv lock' locally and commit the updated uv.lock"
          exit 1
        fi

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync

    - name: Check Python syntax
      run: |
        uv run python -m compileall src/garmin_mcp -q
        echo "✅ All Python files have valid syntax"

    - name: Lint with ruff
      run: |
        uv run ruff check src/ tests/
        echo "✅ Ruff linting passed"

    - name: Format check with ruff
      run: |
        uv run ruff format --check src/ tests/
        echo "✅ Ruff formatting passed"

    - name: Type check with mypy
      run: |
        uv run mypy src/garmin_mcp
        echo "✅ Mypy type checking passed"

    - name: Strict import validation (all modules)
      run: |
        uv run python << 'IMPORT_CHECK'
        import sys
        import importlib
        import pathlib
        sys.path.insert(0, 'src')

        # Dynamically discover all Python modules in src/garmin_mcp
        src_dir = pathlib.Path('src/garmin_mcp')
        modules = set()

        for py_file in src_dir.rglob('*.py'):
            # Skip __pycache__
            if '__pycache__' in py_file.parts:
                continue

            # Convert file path to module name
            # src/garmin_mcp/auth/jwt.py -> garmin_mcp.auth.jwt
            rel_path = py_file.relative_to('src')
            module_name = str(rel_path.with_suffix('')).replace('/', '.')
            modules.add(module_name)

        # Also add package names (directories with __init__.py)
        for init_file in src_dir.rglob('__init__.py'):
            if '__pycache__' in init_file.parts:
                continue
            rel_path = init_file.parent.relative_to('src')
            if rel_path != pathlib.Path('.'):
                module_name = str(rel_path).replace('/', '.')
                modules.add(module_name)

        modules = sorted(modules)
        failed = []

        for module_name in modules:
            try:
                importlib.import_module(module_name)
            except Exception as e:
                failed.append((module_name, str(e)))

        if failed:
            print('❌ Import validation FAILED:')
            for mod, error in failed:
                print(f'  {mod}: {error}')
            sys.exit(1)

        print(f'✅ All {len(modules)} modules imported successfully:')
        for mod in modules:
            print(f'  - {mod}')
        IMPORT_CHECK
