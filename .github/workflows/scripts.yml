name: Script validation

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'infra/azure/scripts/**'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'infra/azure/scripts/**'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax check (bash -n)
        run: |
          find deploy/ infra/ -name '*.sh' -exec bash -n {} \;
      - name: Lint (shellcheck)
        run: |
          find deploy/ infra/ -name '*.sh' -exec shellcheck {} \;
