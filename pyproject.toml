[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
# Include vendored static assets (htmx.min.js)
packages = ["src/garmin_mcp"]

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server to access Garmin data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.2.2",
    "garminconnect==0.2.38",
    "requests==2.33.0",
    "mcp>=1.23.0",
    "garth>=0.5.17,<0.6.0",
    "uvicorn>=0.30,<1.0",
    "httpcore>=1.0.9",
]

[project.scripts]
garmin-mcp = "garmin_mcp._stdio:main"
garmin-mcp-http = "garmin_mcp.server:main"
garmin-mcp-auth = "garmin_mcp.auth_cli:main"
garmin-mcp-rotate-data-key = "garmin_mcp.maintenance.rotate_data_key:main"
garmin-mcp-verify-audit = "garmin_mcp.maintenance.verify_audit:main"

[tool.uv]
dev-dependencies = [
    "asgi-lifespan>=2.1.0",
    "bandit>=1.9.4",
    "coverage>=7.0",
    "detect-secrets>=1.5.0",
    "mypy>=1.0",
    "pre-commit>=4.0",
    "pytest>=9.0.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.8",
]

[tool.uv.sources]
garmin-mcp = { workspace = true }

[tool.bandit]
exclude_dirs = [".venv", "tests", "__pycache__", ".git"]
skips = ["B101", "B311"]  # B101=assert (tests use it), B311=random (not cryptographic)

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "__pycache__", ".git"]

[tool.ruff.lint]
per-file-ignores = {"src/garmin_mcp/__init__.py" = ["F401"], "tests/unit/test_auth_throttle.py" = ["E402"], "tests/unit/test_user_context.py" = ["E402"], "tests/unit/test_auth_storage.py" = ["E731"], "tests/unit/test_maintenance_rotate.py" = ["B017"]}
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["tests/", ".venv/", "src/garmin_mcp/__init__.py", "src/garmin_mcp/_stdio.py"]
# Allow untyped defs — tool modules wrap untyped garminconnect API.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "garminconnect.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "garth.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

# Tool modules wrap untyped garminconnect — allow Any-type operations.
[[tool.mypy.overrides]]
module = [
    "garmin_mcp.tools.activities",
    "garmin_mcp.tools.challenges",
    "garmin_mcp.tools.training",
    "garmin_mcp.tools.weight",
    "garmin_mcp.tools.health",
    "garmin_mcp.tools.gear",
    "garmin_mcp.tools._token_utils",
    "garmin_mcp.tools.devices",
    "garmin_mcp.tools.nutrition",
    "garmin_mcp.tools.data",
    "garmin_mcp.tools.user_profile",
    "garmin_mcp.tools.womens_health",
    "garmin_mcp.tools.workout_templates",
    "garmin_mcp.tools.workouts",
]
disallow_untyped_defs = false
ignore_errors = true

# auth/ modules with known Starlette form typing issues.
[[tool.mypy.overrides]]
module = [
    "garmin_mcp.auth.onboarding",
    "garmin_mcp.auth.onboarding_routes",
]
ignore_errors = true

[tool.coverage.run]
source = ["src/garmin_mcp"]
omit = ["*/tests/*", "*/__pycache__/*", "src/garmin_mcp/_stdio.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
